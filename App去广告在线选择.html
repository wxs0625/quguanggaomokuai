  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --panel:#ffffff; --text:#172033; --muted:#667085; --line:#d8dee9; --brand:#2563eb; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 5; background: rgba(246,247,251,.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .meta { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .toolbar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; margin-top: 14px; align-items: center; }
    input[type="search"] { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; background: #fff; }
    button { height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
    button.primary { background: var(--brand); border-color: var(--brand); color: white; }
    button.danger { color: var(--danger); }
    main { max-width: 1120px; margin: 0 auto; padding: 18px; }
    .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    label.app { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    label.app input { width: 18px; height: 18px; flex: 0 0 auto; }
    label.app span { overflow-wrap: anywhere; }
    textarea { width: 100%; min-height: 160px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; display: none; }
    .hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
    @media (max-width: 760px) { .toolbar { grid-template-columns: 1fr 1fr; } input[type="search"] { grid-column: 1 / -1; } }
  </style>

    </div>
  </header>

    const selected = new Set(JSON.parse(localStorage.getItem(key) || '[]'));
    const list = document.getElementById('list');
    const search = document.getElementById('search');
    const output = document.getElementById('output');
    const save = () => localStorage.setItem(key, JSON.stringify([...selected]));
    const filtered = () => apps.filter(name => name.toLowerCase().includes(search.value.trim().toLowerCase()));
    function render() {
      const rows = filtered();
      list.innerHTML = '';
      for (const name of rows) {
        const label = document.createElement('label');
        label.className = 'app';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selected.has(name);
        checkbox.addEventListener('change', () => { checkbox.checked ? selected.add(name) : selected.delete(name); save(); renderSummary(rows.length); });
        const span = document.createElement('span');
        span.textContent = name;
        label.append(checkbox, span);
        list.append(label);
      }
      renderSummary(rows.length);
    }
    function renderSummary(shownCount) {
      document.getElementById('total').textContent = 全部：;
      document.getElementById('shown').textContent = 当前显示：;
      document.getElementById('checked').textContent = 已勾选移除：;
    }
    search.addEventListener('input', render);
    document.getElementById('selectVisible').onclick = () => { filtered().forEach(name => selected.add(name)); save(); render(); };
    document.getElementById('clearVisible').onclick = () => { filtered().forEach(name => selected.delete(name)); save(); render(); };
    document.getElementById('clearAll').onclick = () => { selected.clear(); save(); render(); output.style.display = 'none'; };
    document.getElementById('export').onclick = async () => {
      const lines = [...selected].map((name, index) => ${index + 1}. [x] );
      const text = lines.join('\n') || '未勾选任何 App';
      output.value = text;
      output.style.display = 'block';
      output.focus();
      output.select();
      try { await navigator.clipboard.writeText(text); } catch (e) {}
    };
    render();
