    button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
    button.danger { color:var(--danger); }
    .export-row { display:grid; grid-template-columns:1fr auto auto; gap:10px; margin-top:10px; }
    .summary { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
    label.app { display:flex; gap:8px; align-items:center; min-height:44px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    label.app:has(input:checked) { border-color:#93c5fd; background:#eff6ff; }
    label.app input { width:18px; height:18px; flex:0 0 auto; }
    .num { min-width:34px; color:var(--muted); font-size:13px; }
    .name { overflow-wrap:anywhere; }
    label.app.hidden { display:none; }
    .result { display:none; margin-bottom:16px; padding:14px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .result h2 { margin:0 0 10px; font-size:18px; }
    textarea { width:100%; min-height:220px; padding:12px; border:1px solid var(--line); border-radius:8px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px; }
    .status.ok { color:var(--ok); }

  <script>
    (function () {
      const labels = { shown: '当前显示：', kept: '已选保留：', removed: '将移除：', empty: '未勾选任何要保留的 App', copyOk: '已复制，如果系统拦截，请手动选中下方文本复制。' };
      const storageKey = 'ad-module-keep-apps-v1';
      const search = document.getElementById('search');
      const output = document.getElementById('output');
      const result = document.getElementById('result');
      const status = document.getElementById('status');
      const items = Array.from(document.querySelectorAll('label.app'));
      const checkboxes = items.map(item => item.querySelector('input'));
      const getSaved = () => { try { return new Set(JSON.parse(localStorage.getItem(storageKey) || '[]')); } catch (e) { return new Set(); } };
      const save = () => { try { localStorage.setItem(storageKey, JSON.stringify(checkboxes.filter(c => c.checked).map(c => c.value))); } catch (e) {} };
      const saved = getSaved();
      checkboxes.forEach(c => { c.checked = saved.has(c.value); c.addEventListener('change', () => { save(); updateSummary(); }); });
      const visibleItems = () => items.filter(item => !item.classList.contains('hidden'));
      const keptValues = () => checkboxes.filter(c => c.checked).map(c => c.value);
      function updateSummary() {
        const kept = keptValues().length;
        document.getElementById('shown').textContent = labels.shown + visibleItems().length;
        document.getElementById('kept').textContent = labels.kept + kept;
        document.getElementById('removed').textContent = labels.removed + (checkboxes.length - kept);
      }
      function renderExport() {
        const kept = keptValues();
        const lines = kept.map((value, index) => (index + 1) + '. [x] ' + value);
        output.value = lines.join('
') || labels.empty;
        result.style.display = 'block';
        result.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return output.value;
      }
      function filter() {
        const q = search.value.trim().toLowerCase();
        items.forEach(item => { item.classList.toggle('hidden', q && !item.dataset.name.toLowerCase().includes(q)); });
        updateSummary();
      }
      async function copyText(text) {
        try { await navigator.clipboard.writeText(text); } catch (e) { output.focus(); output.select(); document.execCommand('copy'); }
        status.textContent = labels.copyOk;
        status.className = 'status ok';
      }
      search.addEventListener('input', filter);
      document.getElementById('selectVisible').addEventListener('click', () => { visibleItems().forEach(item => item.querySelector('input').checked = true); save(); updateSummary(); });
      document.getElementById('clearVisible').addEventListener('click', () => { visibleItems().forEach(item => item.querySelector('input').checked = false); save(); updateSummary(); });
      document.getElementById('selectAll').addEventListener('click', () => { checkboxes.forEach(c => c.checked = true); save(); updateSummary(); });
      document.getElementById('clearAll').addEventListener('click', () => { checkboxes.forEach(c => c.checked = false); save(); updateSummary(); result.style.display = 'none'; });
      document.getElementById('export').addEventListener('click', () => { renderExport(); });
      document.getElementById('copy').addEventListener('click', () => { copyText(renderExport()); });
      document.getElementById('download').addEventListener('click', () => {
        const text = renderExport();
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'keep-apps.txt';
        document.body.appendChild(link);
        link.click();
        URL.revokeObjectURL(link.href);
        link.remove();
      });
      updateSummary();
    })();
  </script>
