const rows = document.getElementById('rows');
const count = document.getElementById('count');
const input = document.getElementById('q');
function esc(value){return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
  const key = input.value.trim().toLowerCase();
  const shown = data.filter(item => !key || (item.name + ' ' + item.source).toLowerCase().includes(key));
  rows.innerHTML = shown.map(item => '<tr><td>' + esc(item.name) + '</td><td class="' + (item.default === 'true' ? 'on' : 'off') + '">' + esc(item.default) + '</td><td>' + esc(item.source) + '</td></tr>').join('');
  count.textContent = '显示 ' + shown.length + ' / ' + data.length + ' 个开关';
}
input.addEventListener('input', render);
render();
